<!doctype html><meta charset=utf-8><title>Scrollbar geometry</title>
<style>html,body{margin:0}#percent{width:100%;height:10px;background:#57a}#vw{width:100vw;height:10px;background:#a75}#fixed{position:fixed;left:0;right:0;top:40px;height:10px;background:#5a7}#content{height:200px}#nested{position:absolute;top:100px;left:30px;width:200px;height:100px;border:2px solid;padding:3px;overflow:auto}#inside{height:300px;width:100%}</style>
<div id=percent></div><div id=vw></div><div id=fixed></div><div id=content></div><div id=nested><div id=inside></div></div>
