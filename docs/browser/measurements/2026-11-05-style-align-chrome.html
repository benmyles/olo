<!doctype html><meta charset="utf-8"><title>Olo style alignment reference</title><script>
addEventListener('DOMContentLoaded',()=>{for(const upright of [false,true]){const parent=document.createElement('div');parent.style.cssText='writing-mode:vertical-rl;direction:rtl;text-align:start;'+(upright?'text-orientation:upright':'');const child=parent.appendChild(document.createElement('div'));child.style.cssText='writing-mode:horizontal-tb;text-align:-webkit-match-parent';document.body.appendChild(parent);const value=getComputedStyle(child).textAlign;const support=CSS.supports('text-align','match-parent');const prefixed=CSS.supports('text-align','-webkit-match-parent');const declared=child.style.textAlign;const parentDirection=getComputedStyle(parent).direction;parent.remove();const p=document.createElement('p');p.textContent=JSON.stringify({upright,textAlign:value,support,prefixed,declared,parentDirection});document.body.appendChild(p);}for(const upright of [false,true]){const root=document.documentElement;root.style.cssText='direction:rtl;text-align:-webkit-match-parent;'+(upright?'writing-mode:vertical-rl;text-orientation:upright':'');const value=getComputedStyle(root).textAlign;root.removeAttribute('style');const p=document.createElement('p');p.textContent=JSON.stringify({root:true,upright,textAlign:value});document.body.appendChild(p);}});
</script>
