<!doctype html><title>Smooth scroll clock</title><style>body{font:18px sans-serif}#outer{overflow:auto;width:400px;height:200px}#inner{position:relative;width:1600px;height:600px}#target{position:absolute;left:1000px;top:300px;width:100px;height:50px;background:#9cf}</style><button id=start>Start smooth scroll</button><div id=outer><div id=inner><div id=target>Target</div></div></div><script>const outer=document.getElementById('outer'),target=document.getElementById('target');let samples=[],start=0;outer.addEventListener('scroll',()=>samples.push([performance.now()-start,outer.scrollLeft,outer.scrollTop]));document.getElementById('start').onclick=()=>{start=performance.now();target.scrollIntoView({behavior:'smooth',container:'nearest'}).then(result=>console.log('SCROLL_ANIMATION '+JSON.stringify({result,samples,elapsed:performance.now()-start,offset:[outer.scrollLeft,outer.scrollTop]})))}</script>
