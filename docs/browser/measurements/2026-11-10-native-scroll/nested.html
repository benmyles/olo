<!doctype html><meta charset=utf-8><title>Nested wheel</title><style>html,body{margin:0;overflow:hidden}main{margin:32px;width:600px;height:300px;overflow:auto;background:#def}section{height:2000px;padding:24px}button{margin:20px}</style><button id=block>Block nested wheel</button><button id=allow>Allow nested wheel</button><p id=out>Nested position 0</p><main><section>Scrollable child</section></main><script>let blocked=false;const m=document.querySelector('main');block.onclick=()=>blocked=true;allow.onclick=()=>blocked=false;m.addEventListener('wheel',e=>{if(blocked)e.preventDefault()},{passive:false});m.addEventListener('scroll',()=>out.textContent='Nested position '+m.scrollTop);</script>
