<!doctype html><title>Detached image source regression</title><pre id=result>Loading</pre><script>
(async () => {
 const image = new Image();
 const loaded = new Promise((resolve, reject) => { image.onload = resolve; image.onerror = reject; });
 image.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1"><path fill="rgb(17,91,203)" d="M0 0h1v1H0z"/></svg>');
 await loaded;
 await new Promise(requestAnimationFrame);
 await new Promise(requestAnimationFrame);
 const canvas = document.createElement('canvas');canvas.width = canvas.height = 1;
 const context = canvas.getContext('2d');context.drawImage(image,0,0);
 const value = [image.complete,image.naturalWidth,...context.getImageData(0,0,1,1).data];
 document.getElementById('result').textContent = JSON.stringify(value);
 console.log('DETACHED_IMAGE '+JSON.stringify(value));
})();
</script>
