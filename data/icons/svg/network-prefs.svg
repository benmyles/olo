<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Network: a router with two aerials, its signal above it. -->
<style>.o{paint-order:stroke;stroke:#1b1b1f;stroke-width:1.2;stroke-linejoin:round}.h{fill:none;stroke:#fff;stroke-linecap:round}</style>
<defs>
<radialGradient id="shadow" cx="32" cy="59" r="27" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 51.33) scale(1 .13)"><stop offset="0" stop-opacity=".32"/><stop offset="1" stop-opacity="0"/></radialGradient>
<clipPath id="box"><path d="M5 43Q5 41.8 6.2 41.5L43.8 32.1Q45 31.8 46.1 32.35L57.9 38.25Q59 38.8 59 40L59 48.2Q59 49.4 57.8 49.7L20.2 59.1Q19 59.4 17.9 58.85L6.1 52.95Q5 52.4 5 51.2Z"/></clipPath>
