<linearGradient id="front" x1="0" y1="0" x2="0" y2="12" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4b4e58"/><stop offset="1" stop-color="#2a2c33"/></linearGradient>
<linearGradient id="rod" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#666a74"/><stop offset="1" stop-color="#25272d"/></linearGradient>
<linearGradient id="blue" x1="16" y1="8" x2="44" y2="26" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#62b1ff"/><stop offset="1" stop-color="#1563dc"/></linearGradient>
