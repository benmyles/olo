<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Vault: a small steel safe, a combination dial and a handle on its door. -->
<style>.o{paint-order:stroke;stroke:#1b1b1f;stroke-width:1.2;stroke-linejoin:round}</style>
<defs>
<radialGradient id="shadow" cx="32" cy="60" r="27" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 52.2) scale(1 .13)"><stop offset="0" stop-opacity=".34"/><stop offset="1" stop-opacity="0"/></radialGradient>
<clipPath id="safe"><path d="M6 14Q6 12.5 7.46 12.14L34.54 5.36Q36 5 37.34 5.67L51.66 12.83Q53 13.5 53 15L53 51.7Q53 53.5 51.25 53.94L24.75 60.56Q23 61 21.39 60.2L7.61 53.3Q6 52.5 6 50.7Z"/></clipPath>
<linearGradient id="top" x1="14" y1="9" x2="42" y2="18" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#959cae"/><stop offset="1" stop-color="#6b7284"/></linearGradient>
<linearGradient id="side" x1="8" y1="16" x2="20" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#414756"/><stop offset="1" stop-color="#272c37"/></linearGradient>
<linearGradient id="front" x1="0" y1="0" x2="30" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#596074"/><stop offset="1" stop-color="#3a3f4f"/></linearGradient>
<linearGradient id="door" x1="3" y1="4" x2="27" y2="36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#535a6d"/><stop offset="1" stop-color="#343947"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f6f8"/><stop offset=".5" stop-color="#b9bbc2"/><stop offset="1" stop-color="#777a84"/></linearGradient>
<linearGradient id="knob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c9cbd1"/><stop offset="1" stop-color="#6e717b"/></linearGradient>
<linearGradient id="gold" x1="46" y1="38" x2="60" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe66e"/><stop offset=".5" stop-color="#fcc522"/><stop offset="1" stop-color="#e99a08"/></linearGradient>
</defs>
<g transform="translate(2.6 0)">
<ellipse class="from48" cx="32" cy="60" rx="27" ry="3.5" fill="url(#shadow)"/>
<!-- The safe: its side, its top, its front. -->
<path class="o" fill="#3a3f4f" d="M6 14Q6 12.5 7.46 12.14L34.54 5.36Q36 5 37.34 5.67L51.66 12.83Q53 13.5 53 15L53 51.7Q53 53.5 51.25 53.94L24.75 60.56Q23 61 21.39 60.2L7.61 53.3Q6 52.5 6 50.7Z"/>
<g clip-path="url(#safe)">
<path fill="url(#side)" d="M0 9.5L23 21L23 64L0 64Z"/>
<path fill="url(#top)" d="M0 9.5L23 21L64 10.75L64 0L0 0Z"/>
<!-- The front face, in its own plane: 30 wide, 40 tall, rising one in four. -->
<g transform="matrix(1 -.25 0 1 23 21)">
<path fill="url(#front)" d="M0 0H31V41H0Z"/>
<rect x="2.8" y="3.2" width="24.6" height="33.4" rx="1.2" fill="#1f232c"/>
<rect x="3.4" y="3.8" width="23.4" height="32.2" rx=".9" fill="url(#door)"/>
<path class="from48" fill="none" stroke="#7d8497" stroke-opacity=".8" stroke-width=".45" d="M4 35.4V4.9Q4 4.4 4.5 4.4H26.2"/>
<!-- The hinges. -->
<g class="from32"><rect x="26" y="5.6" width="3.6" height="9.6" rx=".5" fill="#1b1b1f"/><rect x="26.4" y="6" width="2.8" height="8.8" rx=".3" fill="url(#steel)"/><rect x="26" y="22.4" width="3.6" height="8.6" rx=".5" fill="#1b1b1f"/><rect x="26.4" y="22.8" width="2.8" height="7.8" rx=".3" fill="url(#steel)"/></g>
<!-- The dial: a silver ring, a black band of marks, a knob. -->
<circle cx="14.6" cy="14.6" r="8" fill="#1b1b1f"/>
<circle cx="14.6" cy="14.6" r="7.3" fill="url(#steel)"/>
<circle cx="14.6" cy="14.6" r="5.2" fill="#16181d"/>
<g class="from48" fill="none" stroke="#e9eaee" stroke-width=".5" stroke-linecap="round"><path d="M14.6 9.9v1.3M17.9 11.3l-.9.9M19.3 14.6h-1.3M17.9 17.9l-.9-.9M14.6 19.3v-1.3M11.3 17.9l.9-.9M9.9 14.6h1.3M11.3 11.3l.9.9"/></g>
<g class="from96" fill="none" stroke="#2a2d35" stroke-width=".45" stroke-linecap="round"><path d="M14.6 7.6v1M19.55 9.65l-.7.7M21.6 14.6h-1M19.55 19.55l-.7-.7M14.6 21.6v-1M9.65 19.55l.7-.7M7.6 14.6h1M9.65 9.65l.7.7"/></g>
<circle cx="15" cy="14.9" r="3.7" fill="#1b1b1f"/>
<circle cx="15" cy="14.9" r="3.2" fill="url(#knob)"/>
<!-- The handle: three spokes on a hub. -->
<g stroke-linecap="round"><path fill="none" stroke="#1b1b1f" stroke-width="3" d="M13.2 29L8 24.4M13.2 29L21.6 29.6M13.2 29L9 35"/><path fill="none" stroke="#c4c6cc" stroke-width="1.9" d="M13.2 29L8 24.4M13.2 29L21.6 29.6M13.2 29L9 35"/><path class="from48" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".5" d="M12.6 28L8 23.9M14 28.4L21.4 29"/></g>
<circle cx="13.2" cy="29" r="3.1" fill="#1b1b1f"/>
<circle cx="13.2" cy="29" r="2.6" fill="url(#knob)"/>
</g>
<path class="from48" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".55" stroke-linecap="round" d="M23.6 21.2L52.4 14M23.3 22V59.6"/>
<path class="from48" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width=".5" stroke-linecap="round" d="M7.4 13.4L22.4 20.9"/>
</g>
</g>
</svg>
