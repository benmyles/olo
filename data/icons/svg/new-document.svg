<g transform="translate(47.5 47) scale(1.3)">
<path class="o" fill="#c68306" d="M0-8L2.2-2.2L8 0L2.2 2.2L0 8L-2.2 2.2L-8 0L-2.2-2.2ZM-2.4-9.2L-.2-3.4L5.6-1.2L-.2 1L-2.4 6.8L-4.6 1L-10.4-1.2L-4.6-3.4ZM0-8L2.2-2.2L-.2-3.4L-2.4-9.2ZM-.2-3.4L5.6-1.2L8 0L2.2-2.2ZM8 0L2.2 2.2L-.2 1L5.6-1.2ZM2.2 2.2L0 8L-2.4 6.8L-.2 1ZM-2.4 6.8L-4.6 1L-2.2 2.2L0 8ZM-2.2 2.2L-8 0L-10.4-1.2L-4.6 1ZM-10.4-1.2L-4.6-3.4L-2.2-2.2L-8 0ZM-4.6-3.4L-2.4-9.2L0-8L-2.2-2.2Z"/>
<path fill="#fff3ae" d="M-.2-3.4L5.6-1.2L8 0L2.2-2.2ZM-10.4-1.2L-4.6-3.4L-2.2-2.2L-8 0Z"/>
<path fill="url(#gold)" d="M0-8L2.2-2.2L8 0L2.2 2.2L0 8L-2.2 2.2L-8 0L-2.2-2.2Z"/>
<path class="from48" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".4" stroke-linecap="round" d="M-.1-6.6L1.6-1.9M-6.6-.2L-2-1.9"/>
</g>
</svg>
