<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Home: a little house with a red roof, on Be's yellow slab. -->
<style>.o{paint-order:stroke;stroke:#1b1b1f;stroke-width:1.2;stroke-linejoin:round}.h{fill:none;stroke:#fff;stroke-linecap:round}</style>
<defs>
<radialGradient id="shadow" cx="32" cy="59.8" r="27" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 52.03) scale(1 .13)"><stop offset="0" stop-opacity=".32"/><stop offset="1" stop-opacity="0"/></radialGradient>
<linearGradient id="slabtop" x1="10" y1="40" x2="50" y2="54" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe36a"/><stop offset="1" stop-color="#ffc91a"/></linearGradient>
<linearGradient id="slabfront" x1="0" y1="0" x2="0" y2="4.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6b90e"/><stop offset="1" stop-color="#e09a04"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="24" y2="19" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbfaf6"/><stop offset="1" stop-color="#e4e1d8"/></linearGradient>
<linearGradient id="gable" x1="14" y1="18" x2="26" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d2cfc6"/><stop offset="1" stop-color="#b3b0a7"/></linearGradient>
<linearGradient id="roof" x1="24" y1="10" x2="44" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5247"/><stop offset="1" stop-color="#dc1f1f"/></linearGradient>
<linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#62b1ff"/><stop offset="1" stop-color="#1f6fe8"/></linearGradient>
</defs>
<ellipse class="from48" cx="32" cy="59.8" rx="27" ry="3.4" fill="url(#shadow)"/>
