<path fill="url(#redtop)" d="M-12 -2L-6 -9L6 0L0 7ZM-6 -9L22 -9L34 0L6 0Z"/>
<path fill="url(#red)" d="M0 7L6 0L34 0L40 7L40 27L0 27Z"/>
<path class="h from48" stroke-opacity=".5" stroke-width=".55" d="M.6 7.6L6.2 .7H33.6"/>
