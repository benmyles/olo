<g class="from32"><circle cx="5" cy="18.4" r="1.5" fill="#1b1b1f"/><circle cx="11" cy="18.4" r="1.5" fill="#1b1b1f"/><circle cx="33.4" cy="12.6" r="4.3" fill="#1b1b1f"/><circle cx="33.4" cy="12.6" r="3.5" fill="url(#steel)"/><circle class="from48" cx="33.4" cy="12.6" r="1.5" fill="#8b8f9b"/></g>
