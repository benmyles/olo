<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Olo Doctor: a red doctor's bag, a white cross on it, a stethoscope over it. -->
<style>.o{paint-order:stroke;stroke:#1b1b1f;stroke-width:1.2;stroke-linejoin:round}.h{fill:none;stroke:#fff;stroke-linecap:round}</style>
<defs>
<radialGradient id="shadow" cx="32" cy="60" r="26" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 52.2) scale(1 .13)"><stop offset="0" stop-opacity="0.32"/><stop offset="1" stop-opacity="0"/></radialGradient>
<linearGradient id="red" x1="0" y1="0" x2="40" y2="27" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f0483e"/><stop offset="0.5" stop-color="#d42222"/><stop offset="1" stop-color="#a81414"/></linearGradient>
<linearGradient id="redtop" x1="6" y1="14" x2="50" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff8274"/><stop offset="1" stop-color="#e63a30"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#aeb2bc"/></linearGradient>
</defs>
<ellipse class="from48" cx="32" cy="60" rx="26" ry="3.4" fill="url(#shadow)"/>
