<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- AirPlay: a flat monitor on its stand, the white mark of a picture sent to it on its blue screen. -->
<style>.o{paint-order:stroke;stroke:#1b1b1f;stroke-width:1.2;stroke-linejoin:round}.h{fill:none;stroke:#fff;stroke-linecap:round}</style>
<defs>
<radialGradient id="shadow" cx="34" cy="59.6" r="22" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 51.85) scale(1 .13)"><stop offset="0" stop-opacity=".32"/><stop offset="1" stop-opacity="0"/></radialGradient>
<linearGradient id="screen" x1="3" y1="3" x2="42" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#62b1ff"/><stop offset=".5" stop-color="#2380f4"/><stop offset="1" stop-color="#1259d0"/></linearGradient>
<linearGradient id="bezel" x1="0" y1="0" x2="46" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5b5f69"/><stop offset="1" stop-color="#2d3038"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7f9"/><stop offset="1" stop-color="#a3a7b1"/></linearGradient>
<linearGradient id="shine" x1="4" y1="4" x2="18" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<ellipse class="from48" cx="34" cy="59.6" rx="22" ry="3.4" fill="url(#shadow)"/>
<!-- The stand: its foot, its neck. -->
<path class="o" fill="#8d919b" d="M19 55.2L44 49L52 53L52 55L27 61.2L19 57.2Z"/>
<path fill="url(#steel)" d="M19 55.2L44 49L52 53L27 59.2Z"/>
<path class="o" fill="url(#steel)" d="M30.5 43.5L39.5 41.25L41 51.2L32 53.45Z"/>
<!-- The panel: its side and top, its front. -->
<path class="o" fill="#22242b" d="M8 17.5Q8 16.2 9.3 15.9L52.7 5.1Q54 4.8 55.2 5.4L57 6.3Q58 6.8 58 8L58 38.2Q58 39.5 56.7 39.8L13.3 50.6Q12 50.9 10.8 50.3L9 49.4Q8 48.9 8 47.6Z"/>
<g transform="matrix(1 -.25 0 1 11 18.75)">
<rect x="0" y="0" width="47" height="32" rx="1.4" fill="url(#bezel)"/>
<rect x="2.6" y="2.6" width="41.8" height="26.8" rx=".6" fill="#111318"/>
<rect x="3" y="3" width="41" height="26" rx=".4" fill="url(#screen)"/>
<path fill="#fff" stroke="#0b3fa6" stroke-opacity=".5" stroke-width=".4" stroke-linejoin="round" d="M11.6 29L23.5 13.4L35.4 29Z"/>
<path class="from48" fill="url(#shine)" d="M3 3H24L6 29H3Z"/>
<path class="h from48" stroke-opacity=".5" stroke-width=".45" d="M.8 31V1.6Q.8 .8 1.6 .8H45.4"/>
</g>
</svg>
