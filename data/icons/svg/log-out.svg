<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Log out: a door standing open, a green arrow going out through it. -->
<style>.o{paint-order:stroke;stroke:#1b1b1f;stroke-width:1.2;stroke-linejoin:round}.h{fill:none;stroke:#fff;stroke-linecap:round}</style>
<defs>
<radialGradient id="shadow" cx="31" cy="60" r="24" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 52.2) scale(1 .13)"><stop offset="0" stop-opacity="0.32"/><stop offset="1" stop-opacity="0"/></radialGradient>
<linearGradient id="wood" x1="0" y1="0" x2="24" y2="42" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e9a659"/><stop offset="1" stop-color="#c9793a"/></linearGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="11" y2="37" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#dc9550"/><stop offset="1" stop-color="#b96a2c"/></linearGradient>
<linearGradient id="green" x1="0" y1="-9" x2="20" y2="9" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7beb70"/><stop offset="0.5" stop-color="#3fc640"/><stop offset="1" stop-color="#1d9a29"/></linearGradient>
<linearGradient id="dark" x1="3" y1="3" x2="21" y2="42" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#34363f"/><stop offset="1" stop-color="#111216"/></linearGradient>
</defs>
<ellipse class="from48" cx="31" cy="60" rx="24" ry="3.4" fill="url(#shadow)"/>
<g transform="matrix(1 -.25 0 1 12 15)">
<path class="o" fill="#8a4c1c" d="M0 0H24V42H0Z" transform="translate(-3 -2.25)"/>
<path class="o" fill="url(#wood)" d="M0 0H24V42H0Z"/>
<path fill="url(#dark)" stroke="#1b1b1f" stroke-width=".6" d="M3.2 3.2H20.8V42H3.2Z"/>
</g>
<!-- The door, swung open toward us. -->
<g transform="matrix(1 .5 0 1 15.2 17.4)">
<path class="o" fill="url(#leaf)" d="M0 0H11V37.4H0Z"/>
<path class="from48" fill="none" stroke="#8a4c1c" stroke-width=".5" d="M2 3H9V16H2ZM2 20H9V34.4H2Z"/>
<circle class="from32" cx="8.6" cy="20" r="1.5" fill="#e3e5ea" stroke="#1b1b1f" stroke-width=".5"/>
</g>
<!-- The arrow, going out. -->
<g transform="matrix(1 -.25 0 1 35.5 33)">
<path class="o" fill="#14761f" d="M0 -3.6L11 -3.6L11 -8.4L21.5 0L11 8.4L11 3.6L0 3.6ZM-3 -5.85L8 -5.85L8 -10.65L18.5 -2.25L8 6.15L8 1.35L-3 1.35ZM-3 -5.85L8 -5.85L11 -3.6L0 -3.6ZM8 -5.85L8 -10.65L11 -8.4L11 -3.6ZM11 -8.4L21.5 0L18.5 -2.25L8 -10.65ZM21.5 0L11 8.4L8 6.15L18.5 -2.25ZM8 6.15L8 1.35L11 3.6L11 8.4ZM11 3.6L0 3.6L-3 1.35L8 1.35ZM-3 1.35L-3 -5.85L0 -3.6L0 3.6Z"/>
<path fill="#b4f5ab" d="M-3 -5.85L8 -5.85L11 -3.6L0 -3.6Z"/>
<path fill="url(#green)" d="M0 -3.6L11 -3.6L11 -8.4L21.5 0L11 8.4L11 3.6L0 3.6Z"/>
