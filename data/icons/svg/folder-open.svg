<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Open folder: a manila folder open, papers standing in it. -->
<style>.o{paint-order:stroke;stroke:#1b1b1f;stroke-width:1.2;stroke-linejoin:round}</style>
<defs>
<linearGradient id="shadow" x1="33" y1="53.4" x2="34.1" y2="57.8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-opacity=".34"/><stop offset="1" stop-opacity="0"/></linearGradient>
<clipPath id="back"><path d="M3 15.5L3.1 13.05Q3.2 10.6 5.63 10L20.04 6.41Q21.5 6.05 22.59 7.08L25.92 10.25Q26.5 10.8 27.28 10.61L51.06 4.68Q53 4.2 53 6.2L53 30L40 50L6.46 57.67Q5 58 4.93 56.5Z"/></clipPath>
<linearGradient id="inside" x1="20" y1="8" x2="30" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f9c85c"/><stop offset="1" stop-color="#dc9a26"/></linearGradient>
<linearGradient id="spine" x1="3" y1="14" x2="7" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffc94c"/><stop offset="1" stop-color="#e79f1c"/></linearGradient>
<linearGradient id="flap" x1="16" y1="26" x2="54" y2="54" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fedd88"/><stop offset=".5" stop-color="#f8ca66"/><stop offset="1" stop-color="#e9ae49"/></linearGradient>
<linearGradient id="paper" x1="10" y1="12" x2="50" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe2ec"/></linearGradient>
</defs>
<path class="from48" fill="url(#shadow)" d="M6 58L57 45.2L60.5 48.8L11 61.8Z"/>
<!-- The back, with its tab; the fold at the left. -->
<path class="o" fill="url(#inside)" d="M3 15.5L3.1 13.05Q3.2 10.6 5.63 10L20.04 6.41Q21.5 6.05 22.59 7.08L25.92 10.25Q26.5 10.8 27.28 10.61L51.06 4.68Q53 4.2 53 6.2L53 30L40 50L6.46 57.67Q5 58 4.93 56.5Z"/>
