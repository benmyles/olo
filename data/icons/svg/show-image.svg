<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- ShowImage: a photograph standing, a camera's lens before it. -->
<style>.o{paint-order:stroke;stroke:#1b1b1f;stroke-width:1.2;stroke-linejoin:round}.h{fill:none;stroke:#fff;stroke-linecap:round}</style>
<defs>
<radialGradient id="shadow" cx="32" cy="60.2" r="26" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 52.37) scale(1 .13)"><stop offset="0" stop-opacity="0.32"/><stop offset="1" stop-opacity="0"/></radialGradient>
<linearGradient id="paper" x1="0" y1="0" x2="34" y2="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e6ee"/></linearGradient>
<linearGradient id="sky" x1="0" y1="3" x2="0" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2f8cf8"/><stop offset="1" stop-color="#bfe3ff"/></linearGradient>
<linearGradient id="lake" x1="0" y1="22" x2="0" y2="30" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1f6fe8"/><stop offset="1" stop-color="#7fc0ff"/></linearGradient>
<clipPath id="view"><rect x="3" y="3" width="28" height="27"/></clipPath>
<linearGradient id="barrel" x1="-22" y1="-16" x2="-10" y2="16" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5a5d68"/><stop offset="1" stop-color="#17181c"/></linearGradient>
<linearGradient id="rimg" x1="-12" y1="-12" x2="12" y2="12" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6d7280"/><stop offset="0.5" stop-color="#25272d"/><stop offset="1" stop-color="#0b0c0f"/></linearGradient>
<radialGradient id="glass" cx="-3" cy="-3.6" r="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b8a8ff"/><stop offset="0.5" stop-color="#3a3fb0"/><stop offset="1" stop-color="#0b0c2a"/></radialGradient>
</defs>
<ellipse class="from48" cx="32" cy="60.2" rx="26" ry="3.4" fill="url(#shadow)"/>
<g transform="matrix(1 -.25 0 1 6 16.5)">
<path class="o" fill="#b9bcc6" d="M0 0H34V34H0Z" transform="translate(-2.4 -1.8)"/>
<path class="o" fill="url(#paper)" d="M0 0H34V34H0Z"/>
<g clip-path="url(#view)">
<rect x="3" y="3" width="28" height="27" fill="url(#sky)"/>
<circle cx="9" cy="9" r="2.8" fill="#ffe066"/>
<path fill="#5d7fb5" d="M3 22L11 15L15 18.6L22 8.4L31 19V26H3Z"/>
<path class="from48" fill="#fff" d="M22 8.4L25.4 12.4L23 11.8L21.4 13.6L19.4 12.2Z"/>
<rect x="3" y="21.6" width="28" height="8.4" fill="url(#lake)"/>
<path fill="#1d5c38" d="M3 26.4L4.6 18.4L6.4 22.6L8.4 17.4L10.4 23L12 20.6V30H3Z"/>
</g>
</g>
<!-- The lens: its barrel, its rim, its glass. -->
<g transform="matrix(1 -.25 0 1 45.5 44)">
<path class="o" fill="url(#barrel)" d="M8.04 -10.72A13.4 13.4 0 0 1 -8.04 10.72L-16.04 4.72A13.4 13.4 0 0 1 0.04 -16.72Z"/>
<circle cx="0" cy="0" r="13.4" fill="url(#rimg)"/>
<path class="h from48" stroke-opacity="0.4" stroke-width=".55" d="M-12.6 2.68A12.8 12.8 0 0 1 3.35 -12.46"/>

<g class="from48" fill="none" stroke="#6d7280" stroke-opacity=".7" stroke-width=".5"><path d="M-14.57 -2.88V7.12"/><path d="M-15.73 -3.75V6.25"/><path d="M-16.9 -4.62V5.38"/><path d="M-18.07 -5.5V4.5"/><path d="M-19.23 -6.38V3.62"/></g>
<circle r="10.6" fill="#1b1b1f"/><circle r="9.6" fill="#17181c"/><circle r="7.8" fill="url(#glass)"/>
<path class="from32" fill="#fff" fill-opacity=".7" d="M-5-2.6A5.6 5.6 0 0 1-1-5.6A7.4 7.4 0 0 0-5-2.6Z"/>
<circle class="from48" cx="2.8" cy="3" r="1.1" fill="#fff" fill-opacity=".3"/>
</g>
</svg>
