# Olo: the Apple machines' Broadcom Wi-Fi (brcmfmac). Its firmware refuses
# a new address while it is busy (error -52), the state it is in when it
# has stopped joining. Scans keep the chip's own address, so it isn't
# changed every few minutes while idle; each network still gets its own
# (stable-ssid), set once before joining. Installed by Olo Doctor.
[device-olo-brcmfmac]
match-device=driver:brcmfmac
wifi.scan-rand-mac-address=no
