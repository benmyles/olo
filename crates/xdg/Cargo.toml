[package]
name = "olo-xdg"
description = "Freedesktop plumbing shared by app_server and the kit: data directories, .desktop entries, icon lookup and loading"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
olo-theme.workspace = true
png = "0.18"
resvg = { version = "0.45", default-features = false }
libc = "0.2"
tracing.workspace = true
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io", "p2p"] }
