[package]
name = "olo-js"
description = "Olo's browser scripting: V8 with DOM bindings over the Olo web engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
foldhash = "0.2"
olo-web = { path = "../web" }
# Media Source Extensions' byte streams (fragmented MPEG-4, WebM).
olo-mse = { path = "../mse" }
# JavaScript: V8 (C++), the one non-Rust part of the browser, as the mandate allows.
v8 = "152"
url = "2"
# Import maps (JSON).
serde_json.workspace = true
tiny-skia = "0.12"
# WebGL: OpenGL ES through EGL (surfaceless), loaded at first use.
glow = "0.16"
khronos-egl = { version = "6", features = ["dynamic"] }
# OLO_GL_DUMP: canvases written out for checking.
png = "0.17"
# Canvas toDataURL / toBlob: PNG, JPEG and WebP encoders, base64.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
# SVG geometry for scripts (getBBox's rectangles), as olo-web's.
kurbo = "0.11.3"
# Web Crypto: digests, HMAC, random bytes (all already in the tree).
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.3"
# Web Crypto's AES (GCM, CBC, CTR), PBKDF2 and HKDF.
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hkdf = "0.13"
