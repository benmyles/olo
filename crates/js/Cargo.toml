[package]
name = "olo-js"
description = "Olo's browser scripting: V8 with DOM bindings over the Olo web engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
olo-web = { path = "../web" }
# JavaScript: V8 (C++), the one non-Rust part of the browser, as the mandate allows.
v8 = "152"
url = "2"
# Import maps (JSON).
serde_json.workspace = true
tiny-skia = "0.12"
# WebGL: OpenGL ES through EGL (surfaceless), loaded at first use.
glow = "0.16"
khronos-egl = { version = "6", features = ["dynamic"] }
# OLO_GL_DUMP: canvases written out for checking.
png = "0.17"
# Web Crypto: digests, HMAC, random bytes (all already in the tree).
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.3"
