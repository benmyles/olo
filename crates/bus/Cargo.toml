[package]
name = "olo-bus"
description = "A D-Bus session bus of an agent screen's own (busd's, in Rust, on async-io)"
version.workspace = true
edition.workspace = true
# busd's code is MIT (LICENSE-MIT); Olo's changes go with it.
license = "MIT"

[[bin]]
name = "olo-bus"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-io = "2.6"
async-lock = "3.4"
enumflags2 = "0.7"
event-listener = "5.4"
fastrand = "2.2"
libc = "0.2"
futures-util = { version = "0.3", default-features = false }
rustix = { version = "1.1", default-features = false, features = ["process"] }
serde = { version = "1", features = ["derive", "rc"] }
smol = "2"
tracing.workspace = true
tracing-subscriber.workspace = true
zbus = { version = "5.19", default-features = false, features = ["async-io", "bus-impl", "blocking-api"] }
olo-crash.workspace = true
