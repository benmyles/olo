[package]
name = "app_server"
description = "Olo's Wayland compositor and window manager (the BeOS app_server)"
version.workspace = true
edition.workspace = true
license = "MIT"
# Derived from Smithay's Anvil reference compositor (MIT, Victor Berger and
# Victoria Brekenfeld); see crates/app_server/NOTICE.

[[bin]]
name = "olo-app-server"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-sync.workspace = true
olo-system.workspace = true
olo-color.workspace = true
zeroize = "1"
olo-hvif.workspace = true
libc = "0.2"
rustix = { version = "1.0.7", features = ["fs"] }
olo-palm.workspace = true
signal-hook = "0.3"
bitflags = "2.2.1"
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
rand = "0.8"
tracing = { version = "0.1.37", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
thiserror = "1"
xkbcommon = "0.8.0"
smithay-drm-extras = { workspace = true, optional = true }
profiling = "1.0"
serde.workspace = true
serde_json.workspace = true
olo-protocol.workspace = true
olo-theme.workspace = true
olo-xdg.workspace = true
tiny-skia = "0.12"
cosmic-text = "0.19"
olo-images.workspace = true
# Smithay's libinput, with the newer options (three-finger drag, plugins).
input = { version = "0.10", optional = true, features = ["libinput_1_30"] }
fast_image_resize = "5"

[dependencies.smithay]
workspace = true
features = ["desktop", "wayland_frontend"]

[features]
default = ["egl", "winit", "udev"]
egl = ["smithay/use_system_lib", "smithay/backend_egl"]
udev = [
  "smithay-drm-extras",
  "smithay/backend_libinput",
  "dep:input",
  "smithay/backend_udev",
  "smithay/backend_drm",
  "smithay/backend_gbm",
  "smithay/backend_vulkan",
  "smithay/backend_egl",
  "smithay/backend_session_libseat",
  "smithay/renderer_gl",
  "smithay/renderer_pixman",
  "smithay/renderer_multi",
]
winit = ["smithay/backend_winit", "smithay/backend_drm"]
libei = ["smithay/backend_libei", "udev"]
renderer_sync = []
debug = []
profile-with-tracy-mem = []

[dev-dependencies]
# Runs touchpad.lua against scripted frames (touch_filter's tests).
mlua = { version = "0.10", features = ["lua54", "vendored"] }
# examples/color_probe: a client tagging its window's colours.
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
