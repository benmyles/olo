[package]
name = "olo-video"
description = "Video made in process: H.264 from OpenH264 into an MP4 of Olo's own writing, for screen recordings and Agent Screens' exports"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openh264 = "0.9"
libc = "0.2"
# NVENC's declarations, nothing linked (nvenc.rs opens the library).
nvenc-sys = { path = "../../vendor/nvenc-sys" }
# NVDEC's declarations, nothing linked (nvdec.rs opens the library).
nvdec-sys = { path = "../../vendor/nvdec-sys" }
# AV1 on Intel's and AMD's GPUs (VA-API).
olo-vaapi.workspace = true
# Recordings made GIFs (gif.rs).
mp4 = "0.14"
# HEVC's and AV1's pictures decoded (a GIF of such a recording).
olo-images.workspace = true
gif = "0.14"
color_quant = "1.1"
# A recording's sound decoded to be cut and coded again (export.rs).
symphonia = { version = "0.5", default-features = false, features = ["aac"] }

[dev-dependencies]
# Pictures checked against the reference decoders' MD5s (tests/reference.rs).
md5 = "0.8"
png = "0.18"
# Dmabufs to encode from (`vaapi_dmabuf_frames_come_back`).
gbm = { version = "0.18", default-features = false }
