<!doctype html><meta charset=utf-8><title>Olo flow geometry reference</title>
<h1>Normal-flow DOM geometry reference</h1><p id=status>Running deterministic local fixtures…</p>
<script>
(async()=>{
 const inputs=await(await fetch('/inputs')).json(),base=await(await fetch('/base')).text(),rows=[];
 for(const input of inputs){
  const frame=document.createElement('iframe');frame.style.cssText=`border:0;position:absolute;left:8px;top:100px;width:${input.width}px;height:${input.height}px`;
  const loaded=new Promise(resolve=>frame.onload=resolve);
  frame.srcdoc=`<!doctype html><html id=root><head><style>@font-face{font-family:'Olo Inline plain';src:url('/font')} ${base}${input.css}</style></head><body id=body>${input.body}</body></html>`;
  document.body.append(frame);await loaded;
  const d=frame.contentDocument;await d.fonts.load("20px 'Olo Inline plain'");await d.fonts.ready;
  if(!d.fonts.check("20px 'Olo Inline plain'"))throw Error('font unavailable');
  const ruler=d.createElement('div');ruler.style.cssText='position:fixed;inset:0;visibility:hidden';d.body.append(ruler);const viewport=ruler.getBoundingClientRect();
  const boxes={};for(const node of d.querySelectorAll('[id]')){const r=node.getBoundingClientRect();boxes[node.id]={x:r.x,y:r.y,width:r.width,height:r.height};}
  rows.push({...input,layoutViewport:{width:viewport.width,height:viewport.height,innerWidth:frame.contentWindow.innerWidth,innerHeight:frame.contentWindow.innerHeight},boxes});frame.remove();
 }
 const report={userAgent:navigator.userAgent,devicePixelRatio,base,scope:'Normal-flow DOM rectangles using original fixed-metric font; not pixels, full CSS, websites or Olo UI.',rows};
 const response=await fetch('/result',{method:'POST',body:JSON.stringify(report)});if(!response.ok)throw Error('saving report failed');
 document.getElementById('status').textContent=`Saved ${rows.length} layouts at DPR ${devicePixelRatio}`;
})().catch(e=>document.getElementById('status').textContent=String(e));
</script>
