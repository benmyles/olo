[package]
name = "olo-web"
description = "Olo's original Rust web engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Identical pixels with scalar premultiplication and mip reduction controls.
scalar-image-processing = []
# Measurement baseline, same token semantics without memchr's SIMD scans.
scalar-scans = []
# Reproduce the initial text-copy/per-insertion-allocation costs in the
# storage benchmark. Same semantics; never enabled in normal builds.
baseline-storage = []
# Counterfactual parser measurements with repeated attribute lookup and
# linear-pair formatting-attribute comparison; identical tree semantics.
baseline-parser = []
# Reproduce generic CSS mixed-block lookahead before the linear early exits.
baseline-css-parser = []
# Reproduce the full decoded String-to-Arc<str> source copy.
baseline-css-byte-copy = []
# Reproduce repeated SIMD error localization on malformed UTF-8.
baseline-utf8-errors = []
# Reproduce per-candidate sibling scans instead of query-local nth indices.
baseline-selector-nth = []
# Storage/precision measurement control for typed color channels.
baseline-color-f64 = []
# Reproduce scalar batches and repacking of already converted colors.
baseline-color-conversion = []
# Same numeric grammar/IEEE semantics without constant-subtree folding.
baseline-math-folding = []
# Operator-order control without combining canonical constant sum terms.
baseline-math-sums = []

# Full rule-scan measurement control, same match/cascade semantics.
baseline-cascade-index = []
# Same computed values with full per-element resolution/storage, no sparse sharing.
baseline-style-dense = []
# Same cascade values using the general outer enum clone for every candidate.
baseline-cascade-value-copy = []
# Shared family list with a fat standard Arc instead of a thin pointer.
baseline-font-family-fat = []
# Same text/Unicode facts without ASCII paragraph/grapheme/script fast paths.
baseline-text-ascii = []
# Same CSS whitespace semantics without bulk printable-ASCII scanning/copying.
baseline-text-prepare = []
# Same source map facts with 24-byte instead of 12-byte stored records.
baseline-text-map-wide = []
# Same Unicode 18 facts/rules without ASCII property/pair/run shortcuts.
baseline-linebreak-ascii = []
# Same ASCII property/pair paths without bulk ASCII run state transitions.
baseline-linebreak-runs = []
# Same class facts via a checked table decode instead of direct packed IDs.
baseline-linebreak-class-table = []
# Measurement control: reshape each visual fragment instead of sharing safe glyph slices.
baseline-inline-reshape = []

[dependencies]
tiny-skia = "0.12"
svgtypes = "0.15.3"
kurbo = "0.11.3"
memchr = "2"
encoding_rs = "0.8"
simdutf8 = "0.1"
smallvec = "1"
wide = "1.7"
triomphe = { version = "0.1.17", default-features = false, features = ["std"] }
ttf-parser = "0.25.1"
harfrust = "0.15.0"
unicode-bidi = {version="0.3.18",default-features=false,features=["std"]}

[dev-dependencies]
serde_json.workspace = true
sha2 = "0.10"
