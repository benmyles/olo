[package]
name = "olo-fakesound"
description = "A sound server for tests: enough of the PulseAudio protocol for Olo's players, playing nothing and saying what it hears"
version.workspace = true
edition.workspace = true
license.workspace = true

# (A package of its own, with only what it uses: as a binary of
# olo-preview it was built again for every change to anything olo-preview
# depends on, to the same bytes; 66 of kache's keys made one executable.)
[dependencies]
olo-crash.workspace = true
olo-sync.workspace = true
pulseaudio = "0.3"

# (Its tests play Olo's own sounds into it: olo-preview's players, for
# its tests only. Under olo-preview they named this package's executable,
# which Cargo names only to a test of the package it is in, and the
# workspace's tests stopped compiling there: `cargo test --workspace`.)
[dev-dependencies]
olo-preview.workspace = true
