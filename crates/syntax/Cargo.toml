[package]
name = "olo-syntax"
description = "Source code coloured by syntax, in process: tree-sitter's grammars for every major language, parsed incrementally on a worker, classes for any stretch of the text"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
olo-theme.workspace = true
streaming-iterator = "0.1"
tree-sitter = "0.27"
# The grammars (each a parser in C, compiled in), their highlight queries
# with them but for those in queries/.
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cmake = "0.7"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.3"
tree-sitter-diff = "0.1"
tree-sitter-dockerfile-updated = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-erlang = "0.21"
tree-sitter-fish = "3.6"
tree-sitter-go = "0.25"
tree-sitter-haskell = "0.24"
tree-sitter-html = "0.23"
tree-sitter-ini = "1.4"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-julia = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.26"
tree-sitter-php = "0.25"
tree-sitter-powershell = "0.26"
tree-sitter-proto = "0.6"
tree-sitter-python = "0.25"
tree-sitter-r = "1.3"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"
