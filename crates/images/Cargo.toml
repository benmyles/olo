[package]
name = "olo-images"
description = "Decode pictures natively: the image crate's formats plus JPEG XL, AVIF and HEIC"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "rayon"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
# BSD-2-Clause AV1 decoder (no asm: pure Rust) and MPL-2.0 container parser.
filmcraft-vp9 = "0.9"
rust_h265 = "0.4"
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
avif-parse = "2"
heifer = "0.2"
