[package]
name = "olo-images"
description = "Decode pictures natively: the image crate's formats plus JPEG XL, AVIF and HEIC"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# (wallpaper-hdr, a program: the crash report first, as every one has.)
olo-crash.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "rayon"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
filmcraft-vp9 = "0.9"
rust_h265 = "0.4"
# BSD-2-Clause AV1 decoder, with its x86 assembly (SSE4 and AVX2, chosen
# at run time: nasm builds it), and MPL-2.0 container parser.
rav1d = { version = "1.1", default-features = false, features = ["asm", "bitdepth_8", "bitdepth_16"] }
avif-parse = "2"
heifer = "0.2"
# Embedded colour profiles into sRGB (pure Rust; the image crate's own).
moxcms = "0.8"
# HDR and wide-gamut video's light, primaries and curves (`hdr`).
olo-color.workspace = true
# Gain maps' HDR pictures in half floats (`gain`).
half = "2"
# Lottie animations (`lottie`: Telegram's animated stickers), read by
# velato (vendored: vendor/README.md) and drawn by vello_cpu, in Rust.
velato = { version = "0.12", default-features = false }
vello_cpu = "0.3"
flate2 = "1"

[dev-dependencies]
