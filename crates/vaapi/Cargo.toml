[package]
name = "olo-vaapi"
description = "AV1 encoded, and AV1 and VP9 decoded, on Intel's and AMD's GPUs through VA-API (libva opened at run time), and what each GPU's driver can do"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# AV1's and VP9's bitstream parsers (pure Rust; none of its backends).
cros-codecs = { version = "0.0.6", default-features = false }
libc = "0.2"
tracing.workspace = true
# libva's declarations, nothing linked (the library is opened at run time).
va-sys = { path = "../../vendor/va-sys" }

[dev-dependencies]
md5 = "0.8"
