[package]
name = "olo-vaapi"
description = "AV1 and H.264 encoded, and AV1, VP9, H.264 and HEVC decoded, on Intel's and AMD's GPUs through VA-API (libva opened at run time), and what each GPU's driver can do"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# AV1's, VP9's, H.264's and HEVC's parsers, and its stateless decoders
# (what a decoder keeps between pictures) driving a backend of ours
# (vendored: its own backends, which link libva and libgbm, left out).
cros-codecs = { path = "../../vendor/cros-codecs", default-features = false, features = ["backend"] }
anyhow = "1"
libc = "0.2"
tracing.workspace = true
# libva's declarations, nothing linked (the library is opened at run time).
va-sys = { path = "../../vendor/va-sys" }

[dev-dependencies]
md5 = "0.8"
