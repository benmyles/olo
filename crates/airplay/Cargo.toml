[package]
name = "olo-airplay"
description = "Sending to AirPlay receivers, natively: finding them on the network (mDNS, DNS-SD), pairing with them, and playing a film on one"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "olo-airplay"
path = "src/bin/olo-airplay.rs"

[dependencies]
olo-crash.workspace = true
olo-xdg.workspace = true
olo-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
# Pairing (HomeKit's, which AirPlay 2 uses): SRP, the curves, the cipher.
num-bigint = "0.4"
sha2 = "0.11"
hkdf = "0.13"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
curve25519-dalek = "5"
getrandom = "0.3"
zeroize = "1"
# Playing: AirPlay's messages are binary property lists.
plist = { version = "1", default-features = false }
