# Olo's Interface Kit (docs/HACKING.md, "The Interface Kit"; the Olo
# Book). Its lower half (the Wayland client, text, the scene and the
# renderer) began as Olo's GPUI (gpui/, from Zed's GPUI 0.2.2,
# Apache-2.0: see LICENSE-APACHE there); the rest is Olo's own.
[package]
name = "olo-interface"
description = "Olo's Interface Kit: windows, views and drawing, retained, a looper a window"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
name = "olo_interface"
path = "src/lib.rs"
doctest = false

[features]
default = []
runtime_shaders = []

[dependencies]
olo-app = { workspace = true }
olo-sync = { workspace = true }
anyhow = "1.0.86"
async-task = "4.7"
collections = { path = "../../gpui/collections", package = "gpui_collections" }
derive_more = "0.99.17"
etagere = "0.2"
futures = "0.3"
gpui_macros = { path = "../../gpui/macros", package = "gpui-macros" }
image = "0.25.1"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
lyon = "1.0"
parking = "2.0.0"
parking_lot = "0.12.1"
profiling = "1"
raw-window-handle = "0.6"
refineable = { path = "../../gpui/refineable", package = "gpui_refineable" }
resvg = { version = "0.45.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
schemars = { version = "1.0", features = ["indexmap2"] }
seahash = "4.1"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union"] }
smol = "2.0"
strum = { version = "0.27.2", features = ["derive"] }
taffy = "=0.9.0"
thiserror = "2.0.12"
tracing = { workspace = true }
usvg = { version = "0.45.0", default-features = false }
util = { path = "../../gpui/util", package = "gpui_util" }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
waker-fn = "1.2.0"
ashpd = { version = "0.11", default-features = false, features = ["async-std", "wayland"] }
blade-graphics = { version = "0.7.0" }
blade-macros = { version = "0.3.0" }
blade-util = { path = "../../gpui/blade-util" }
fontdb = "0.23"
harfrust = "0.12"
skrifa = { version = "0.44", default-features = false, features = ["std", "autohint_shaping"] }
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline", "f32_pipeline", "text", "png"] }
ab_glyph_rasterizer = "0.1.10"
memmap2 = "0.9"
olo-theme = { workspace = true }
olo-emoji = { workspace = true, default-features = false }
olo-protocol = { workspace = true }
olo-xdg = { workspace = true }
bytemuck = { version = "1" }
calloop = "0.13.0"
calloop-wayland-source = { version = "0.3.0" }
filedescriptor = { version = "0.8.2" }
flume = "0.11"
pathfinder_geometry = "0.5"
wayland-backend = { version = "0.3.3", features = ["client_system", "dlopen"] }
wayland-client = { version = "0.31.2" }
wayland-cursor = { version = "0.31.1" }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-plasma = { version = "0.2.0", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.8.0", features = ["wayland"] }

[dev-dependencies]
rand = "0.9"
backtrace = "0.3"
tracing-subscriber = { workspace = true }
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
unicode-segmentation = "1.10"

[build-dependencies]
naga = { version = "25.0", features = ["wgsl-in"] }

[lints.rust]
unexpected_cfgs = "allow"
