[package]
name = "olo-rex-client"
description = "Native async Rust Rex API revision 19 protocol client, native SSH transport, tunnel relay, and kit-free Deskbar Glance provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-rex-glance"
path = "src/bin/olo-rex-glance.rs"

[dependencies]
# (Its Deskbar widget's provider, `olo-rex-glance`, reports a crash as every
# program of Olo's does.)
olo-crash.workspace = true
olo-protocol.workspace = true
olo-sync.workspace = true
olo-theme.workspace = true
olo-xdg.workspace = true
serde.workspace = true
serde_path_to_error = "0.1.20"
olo-rex-link.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "process"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "stream"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = "0.3"
http = "1"
url = "2"
bytes = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# The helper's own link over UDP (`quic.rs`): QUIC, with the TLS the
# crate has already.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
sha2 = "0.11"
# (The person's agent settings carried to a host: `carry`.)
tar = "0.4"
flate2 = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
toml_edit = "0.25"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
webpki-roots = "1"
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "flate2"] }
ssh2-config = "0.9"
zeroize = "1"
jiff = "0.2"
libc = "0.2"
