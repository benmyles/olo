[package]
name = "olo-interface-macros"
description = "The Interface Kit's macros: the Styled helpers (.flex(), .p_2(), .border_1()…) and #[derive(Refineable)]"
version.workspace = true
edition.workspace = true
# (Began as Zed's gpui-macros and gpui_derive_refineable, Apache-2.0:
# LICENSE-APACHE. Olo's own now; GPUI itself is gone.)
license = "Apache-2.0"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.93"
quote = "1.0.9"
syn = { version = "2.0.101", features = ["full", "extra-traits", "visit-mut"] }
