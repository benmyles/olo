[package]
name = "olo-screensavers"
description = "The BeOS R5 screen saver modules (for olo-screensaver and the Preferences preview), drawn through a canvas on Olo's GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The canvas on Olo's GPUI (olo-screensaver).
gpui = ["dep:olo-ui", "dep:image"]

[dependencies]
olo-ui = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, optional = true }
