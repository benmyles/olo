[package]
name = "olo-voice"
description = "Voice processing for every microphone: echo cancellation, noise suppression and level normalization, real time"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sonora = { path = "../../vendor/sonora/crates/sonora" }
deep_filter = { path = "../../vendor/deep_filter", default-features = false, features = ["tract"] }
ndarray = "0.17"
realfft = "3"
olo-protocol.workspace = true

[dev-dependencies]
# Compared against DeepFilterNet3 for a least-delay choice (tests/least_delay.rs).
nnnoiseless = "0.5"
# The timing paced as live on a fast core, as the engine asks for.
olo-system.workspace = true
