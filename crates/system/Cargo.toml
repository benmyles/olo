[package]
name = "olo-system"
description = "Talking to the system natively: logind, PAM, fprintd, NetworkManager, the battery and backlight, D-Bus activation, dconf, the keyring's prompts and the sound server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
olo-crash.workspace = true
olo-sync.workspace = true
olo-protocol.workspace = true
olo-color.workspace = true
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
zvariant = { version = "5", features = ["gvariant"] }
pulseaudio = "0.3.2"
tracing.workspace = true
serde.workspace = true
libloading = "0.8"
libc = "0.2"
async-channel = "2"
# The keyring prompt's secret exchange (keyring_prompt.rs).
num-bigint = "0.4"
aes = "0.9"
cbc = "0.2"
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.3"
# Passwords asked for ([`keyring_prompt::ask_password`]), wiped after.
zeroize = "1"
futures-lite = "2"
# udisks-fake's jobs.
async-io = "2"
# nm-fake's --dump; the GPUs' tuning.
serde_json.workspace = true
# NVIDIA's library (NVML), loaded at run time: gpu_tuning.
nvml-wrapper = "0.13"

[[bin]]
name = "udisks-fake"
path = "src/bin/udisks_fake.rs"

[[bin]]
name = "nm-fake"
path = "src/bin/nm_fake.rs"

[[bin]]
name = "olo-net-admin"
path = "src/bin/net_admin.rs"

[[bin]]
name = "olo-gpu-tune"
path = "src/bin/gpu_tune.rs"
