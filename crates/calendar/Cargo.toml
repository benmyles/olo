[package]
name = "olo-calendar"
description = "Calendar's engine: iCalendar read and written back whole, repeating events worked out, calendars on CalDAV servers (Google's, Fastmail's)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
olo-net.workspace = true
olo-google.workspace = true
olo-system.workspace = true
olo-xdg.workspace = true
jiff = "0.2"
roxmltree = "0.20"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde.workspace = true
serde_json.workspace = true
getrandom = "0.3"
