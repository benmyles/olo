[package]
name = "olo-diskbackup"
description = "DiskBackup's engine: deduplicated, compressed, encrypted, versioned backups to any store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
ciborium = "0.2"
zstd = "0.14"
sha2 = "0.11"
md-5 = "0.11"
hmac = "0.13"
hkdf = "0.13"
chacha20poly1305 = "0.11"
getrandom = "0.3"
globset = "0.4"
libc = "0.2"
serde_json.workspace = true
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
