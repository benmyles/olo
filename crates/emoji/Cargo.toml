[package]
name = "olo-emoji"
description = "Colour emoji: COLRv0/v1 glyphs shaped with harfrust and painted with tiny-skia"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["render"]
# Drawing colour glyphs; without it, only which characters are emoji
# (the Interface Kit's text system).
render = ["dep:skrifa", "dep:harfrust", "dep:tiny-skia"]

[dependencies]
skrifa = { version = "0.46", optional = true }
harfrust = { version = "0.12", optional = true }
tiny-skia = { version = "0.12", optional = true }

[dev-dependencies]
png = "0.18"
