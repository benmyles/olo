# Olo's GPUI: Zed's GPUI 0.2.2 (Apache-2.0, see LICENSE-APACHE), taken as
# Olo's own starting point (docs/HACKING.md, "Olo's GPUI"). Linux and
# Wayland only: its X11, macOS and Windows dependencies are gone.
[package]
name = "gpui"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
description = "Olo's GPU-accelerated UI framework, from Zed's GPUI"
publish = false
build = "build.rs"
autoexamples = false

[lib]
name = "gpui"
path = "src/gpui.rs"
doctest = false

[features]
default = ["wayland"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
runtime_shaders = []
test-support = ["leak-detection", "collections/test-support", "rand", "wayland"]
wayland = [
    "blade-graphics",
    "blade-macros",
    "blade-util",
    "bytemuck",
    "ashpd/wayland",
    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "filedescriptor",
    "xkbcommon",
]

[[example]]
name = "olo_text"
path = "examples/olo_text.rs"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "text"
path = "examples/text.rs"

[[example]]
name = "scrollable"
path = "examples/scrollable.rs"

[[example]]
name = "uniform_list"
path = "examples/uniform_list.rs"

[[example]]
name = "input"
path = "examples/input.rs"

[[example]]
name = "animation"
path = "examples/animation.rs"

[dependencies]
anyhow = "1.0.86"
async-task = "4.7"
backtrace = { version = "0.3", optional = true }
collections = { path = "../collections", package = "gpui_collections" }
ctor = "0.4.0"
derive_more = "0.99.17"
etagere = "0.2"
futures = "0.3"
gpui_macros = { path = "../macros", package = "gpui-macros" }
image = "0.25.1"
inventory = "0.3.19"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
lyon = "1.0"
num_cpus = "1.13"
parking = "2.0.0"
parking_lot = "0.12.1"
pin-project = "1.1.10"
postage = { version = "0.5", features = ["futures-traits"] }
profiling = "1"
rand = { version = "0.9", optional = true }
raw-window-handle = "0.6"
refineable = { path = "../refineable", package = "gpui_refineable" }
resvg = { version = "0.45.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
schemars = { version = "1.0", features = ["indexmap2"] }
seahash = "4.1"
semantic_version = { path = "../semantic_version", package = "gpui_semantic_version" }
serde = { version = "1.0.221", features = ["derive", "rc"] }
# (Not "preserve_order": it would change every crate's JSON in the workspace.)
serde_json = { version = "1.0.144", features = ["raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union"] }
smol = "2.0"
stacksafe = "0.1"
strum = { version = "0.27.2", features = ["derive"] }
sum_tree = { path = "../sum_tree", package = "gpui_sum_tree" }
taffy = "=0.9.0"
thiserror = "2.0.12"
usvg = { version = "0.45.0", default-features = false }
util = { path = "../util", package = "gpui_util" }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
waker-fn = "1.2.0"
ashpd = { version = "0.11", default-features = false, features = ["async-std"], optional = true }
blade-graphics = { version = "0.7.0", optional = true }
blade-macros = { version = "0.3.0", optional = true }
blade-util = { path = "../blade-util", optional = true }
# Olo's text (src/platform/linux/text_system.rs), as the egui kit's.
fontdb = "0.23"
harfrust = "0.12"
skrifa = { version = "0.44", default-features = false, features = ["std", "autohint_shaping"] }
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline", "f32_pipeline", "text", "png"] }
ab_glyph_rasterizer = "0.1.10"
memmap2 = "0.9"
olo-theme = { path = "../../crates/theme" }
# Which characters are emoji, as the rest of Olo has it.
olo-emoji = { path = "../../crates/emoji", default-features = false }
olo-protocol = { path = "../../crates/protocol" }
olo-xdg = { path = "../../crates/xdg" }
bytemuck = { version = "1", optional = true }
calloop = "0.13.0"
calloop-wayland-source = { version = "0.3.0", optional = true }
filedescriptor = { version = "0.8.2", optional = true }
flume = "0.11"
oo7 = { version = "0.5.0", default-features = false, features = ["async-std", "native_crypto"] }
pathfinder_geometry = "0.5"
wayland-backend = { version = "0.3.3", features = ["client_system", "dlopen"], optional = true }
wayland-client = { version = "0.31.2", optional = true }
wayland-cursor = { version = "0.31.1", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"], optional = true }
wayland-protocols-plasma = { version = "0.2.0", features = ["client"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
xkbcommon = { version = "0.8.0", features = ["wayland"], optional = true }

[dev-dependencies]
backtrace = "0.3"
collections = { path = "../collections", package = "gpui_collections", features = ["test-support"] }
env_logger = "0.11"
lyon = { version = "1.0", features = ["extra"] }
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
rand = "0.9"
unicode-segmentation = "1.10"

[build-dependencies]
naga = { version = "25.0", features = ["wgsl-in"] }

[lints.rust]
# (Upstream's cfgs for platforms and features Olo's GPUI dropped.)
unexpected_cfgs = "allow"
