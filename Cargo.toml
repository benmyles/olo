[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.invalid/olo"

[workspace.dependencies]
olo-protocol = { path = "crates/protocol" }
olo-kit = { path = "crates/kit" }
olo-theme = { path = "crates/theme" }
olo-preview = { path = "crates/preview" }
olo-richtext = { path = "crates/richtext" }
olo-xdg = { path = "crates/xdg" }
olo-system = { path = "crates/system" }
olo-onepassword = { path = "crates/onepassword" }
olo-keychain = { path = "crates/keychain" }
olo-screensavers = { path = "crates/screensavers" }
olo-hvif = { path = "crates/hvif" }
olo-emoji = { path = "crates/emoji" }
olo-images = { path = "crates/images" }
olo-token-pool = { path = "crates/pool" }
olo-ai = { path = "crates/ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[workspace.dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "24647fc8d00131eb7f388efed26e35ea316b0018"
default-features = false

[workspace.dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay"
rev = "24647fc8d00131eb7f388efed26e35ea316b0018"

# See vendor/README.md.
[patch.crates-io]
epaint = { path = "vendor/epaint" }
egui-wgpu = { path = "vendor/egui-wgpu" }
wgpu-hal = { path = "vendor/wgpu-hal" }
matroska-demuxer = { path = "vendor/matroska-demuxer" }

[profile.release]
debug = "line-tables-only"

[profile.dev]
opt-level = 1
# File and line in backtraces, without full debuginfo: it made debug
# binaries 600-850 MB each and linking them took gigabytes apiece.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
