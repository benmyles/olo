[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "smithay/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
olo-protocol = { path = "crates/protocol" }
olo-kit-base = { path = "crates/kit-base" }
olo-color = { path = "crates/color" }
olo-sync = { path = "crates/sync" }
olo-yuv = { path = "crates/yuv" }
olo-app = { path = "crates/app" }
olo-interface = { path = "crates/interface" }
olo-kit = { path = "crates/kit" }
olo-net = { path = "crates/net" }
olo-release = { path = "crates/release" }
olo-mail = { path = "crates/mail" }
olo-google = { path = "crates/google" }
olo-calendar = { path = "crates/calendar" }
olo-crash = { path = "crates/crash" }
olo-kmod = { path = "crates/kmod" }
olo-video = { path = "crates/video" }
olo-vaapi = { path = "crates/vaapi" }
olo-syntax = { path = "crates/syntax" }
olo-camera = { path = "crates/camera" }
olo-theme = { path = "crates/theme" }
olo-preview = { path = "crates/preview" }
olo-archive = { path = "crates/archive" }
olo-richtext = { path = "crates/richtext" }
olo-print = { path = "crates/print" }
olo-xdg = { path = "crates/xdg" }
olo-appimage = { path = "crates/appimage" }
olo-system = { path = "crates/system" }
olo-onepassword = { path = "crates/onepassword" }
olo-keychain = { path = "crates/keychain" }
olo-fido = { path = "crates/fido" }
olo-screensavers = { path = "crates/screensavers" }
olo-hvif = { path = "crates/hvif" }
olo-emoji = { path = "crates/emoji" }
olo-capture = { path = "crates/capture" }
olo-palm = { path = "crates/palm" }
olo-complete = { path = "crates/complete" }
olo-images = { path = "crates/images" }
olo-token-pool = { path = "crates/pool" }
olo-airplay = { path = "crates/airplay", default-features = false }
olo-ai = { path = "crates/ai" }
olo-eld = { path = "crates/eld" }
olo-voice = { path = "crates/voice" }
olo-diskbackup = { path = "crates/diskbackup" }
olo-tg = { path = "crates/telegram" }
olo-chime = { path = "crates/chime" }
olo-ocr = { path = "crates/ocr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# Olo's own Smithay (smithay/README.md), from upstream's
# 24647fc8d00131eb7f388efed26e35ea316b0018.
[workspace.dependencies.smithay]
path = "smithay/smithay"
default-features = false

[workspace.dependencies.smithay-drm-extras]
path = "smithay/smithay-drm-extras"

# See vendor/README.md.
[patch.crates-io]
blade-graphics = { path = "vendor/blade-graphics" }
matroska-demuxer = { path = "vendor/matroska-demuxer" }
blocking = { path = "vendor/blocking" }
hayro = { path = "vendor/hayro" }
brush-interactive = { path = "vendor/brush-interactive" }
rust_h265 = { path = "vendor/rust_h265" }
velato = { path = "vendor/velato" }
mp4 = { path = "vendor/mp4" }
taffy = { path = "vendor/taffy" }

[profile.release]
debug = "line-tables-only"

# Dependencies with no debug info (Ben, 2026-11-15: "keep debug info out of
# the executables ... no debug info for dependency crates"), as in dev
# builds: of olo-kache's 290 MB, 258 were debug info, most of it the
# hundreds of crates under Olo's own. Olo's crates keep their line tables,
# in the executable itself (not split out: an installed copy's crash
# report needs them, and target/ is swept), so a crash says file and line
# in Olo's code, and a dependency's frame its function.
[profile.release.package."*"]
debug = false

[profile.dev]
opt-level = 1
# File and line in backtraces, without full debuginfo: it made debug
# binaries 600-850 MB each and linking them took gigabytes apiece.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
