[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.invalid/tabula"

[workspace.dependencies]
tabula-protocol = { path = "crates/protocol" }
tabula-kit = { path = "crates/kit" }
tabula-theme = { path = "crates/theme" }
tabula-preview = { path = "crates/preview" }
tabula-xdg = { path = "crates/xdg" }
tabula-system = { path = "crates/system" }
tabula-onepassword = { path = "crates/onepassword" }
tabula-keychain = { path = "crates/keychain" }
tabula-screensavers = { path = "crates/screensavers" }
tabula-hvif = { path = "crates/hvif" }
tabula-emoji = { path = "crates/emoji" }
tabula-images = { path = "crates/images" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[workspace.dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "24647fc8d00131eb7f388efed26e35ea316b0018"
default-features = false

[workspace.dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay"
rev = "24647fc8d00131eb7f388efed26e35ea316b0018"

# See vendor/README.md.
[patch.crates-io]
epaint = { path = "vendor/epaint" }
matroska-demuxer = { path = "vendor/matroska-demuxer" }
servo-constellation = { path = "vendor/servo-constellation" }
servo-net = { path = "vendor/servo-net" }
servo-paint = { path = "vendor/servo-paint" }
servo-paint-api = { path = "vendor/servo-paint-api" }
servo-pixels = { path = "vendor/servo-pixels" }
webrender = { path = "vendor/webrender" }

[profile.release]
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
