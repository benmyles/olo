[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "gpui/*", "smithay/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.invalid/olo"

[workspace.dependencies]
olo-protocol = { path = "crates/protocol" }
olo-kit-base = { path = "crates/kit-base" }
olo-color = { path = "crates/color" }
olo-sync = { path = "crates/sync" }
olo-crash = { path = "crates/crash" }
olo-video = { path = "crates/video" }
olo-ui = { path = "crates/ui" }
gpui = { path = "gpui/gpui" }
olo-theme = { path = "crates/theme" }
olo-preview = { path = "crates/preview" }
olo-richtext = { path = "crates/richtext" }
olo-print = { path = "crates/print" }
olo-xdg = { path = "crates/xdg" }
olo-system = { path = "crates/system" }
olo-onepassword = { path = "crates/onepassword" }
olo-keychain = { path = "crates/keychain" }
olo-screensavers = { path = "crates/screensavers" }
olo-hvif = { path = "crates/hvif" }
olo-emoji = { path = "crates/emoji" }
olo-capture = { path = "crates/capture" }
olo-palm = { path = "crates/palm" }
olo-complete = { path = "crates/complete" }
olo-images = { path = "crates/images" }
olo-token-pool = { path = "crates/pool" }
olo-ai = { path = "crates/ai" }
olo-eld = { path = "crates/eld" }
olo-voice = { path = "crates/voice" }
olo-tg = { path = "crates/telegram" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# Olo's own Smithay (smithay/README.md), from upstream's
# 24647fc8d00131eb7f388efed26e35ea316b0018.
[workspace.dependencies.smithay]
path = "smithay/smithay"
default-features = false

[workspace.dependencies.smithay-drm-extras]
path = "smithay/smithay-drm-extras"

# See vendor/README.md.
[patch.crates-io]
blade-graphics = { path = "gpui/blade-graphics" }
matroska-demuxer = { path = "vendor/matroska-demuxer" }
blocking = { path = "vendor/blocking" }
brush-interactive = { path = "vendor/brush-interactive" }
rust_h265 = { path = "vendor/rust_h265" }

[profile.release]
debug = "line-tables-only"

[profile.dev]
opt-level = 1
# File and line in backtraces, without full debuginfo: it made debug
# binaries 600-850 MB each and linking them took gigabytes apiece.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
