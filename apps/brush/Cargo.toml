[package]
name = "olo-brush"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "brush (github.com/reubeno/brush), the bash-compatible shell written in Rust, built with Olo so Olo Suggestions can offer it as the login shell"

[[bin]]
name = "olo-brush"
path = "src/main.rs"

[dependencies]
brush-shell = "0.4"
