[package]
name = "olo-preferences"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-preferences"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-ui.workspace = true
olo-xdg.workspace = true
olo-palm.workspace = true
olo-voice.workspace = true
olo-theme.workspace = true
olo-protocol.workspace = true
olo-color.workspace = true
olo-screensavers = { workspace = true, features = ["gpui"] }
olo-system.workspace = true
olo-sync.workspace = true
olo-complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
libc = "0.2"
jiff = "0.2"
# Integrations: asking GitHub who a token is.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
tar = "0.4"
zstd = "0.14"
# Backup: sealing a backup with a passphrase, or a key in the keyring.
argon2 = "0.5"
chacha20poly1305 = "0.11"
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.11"
zeroize = "1"
olo-tg.workspace = true
# Integrations ▸ Telegram: signing in with a QR code.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
olo-ui = { workspace = true, features = ["lint"] }
