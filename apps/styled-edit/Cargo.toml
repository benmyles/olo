[package]
name = "olo-styled-edit"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-styled-edit"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-ui.workspace = true
olo-theme.workspace = true
olo-xdg.workspace = true
# Pictures on the web, fetched (`pictures::fetch`).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
olo-richtext.workspace = true
olo-print = { workspace = true, features = ["gpui"] }
olo-images.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
