[package]
name = "olo-styled-edit"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-styled-edit"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-ui.workspace = true
olo-theme.workspace = true
olo-xdg.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
olo-richtext.workspace = true
olo-print = { workspace = true, features = ["gpui"] }
olo-images.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
