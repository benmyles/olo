[package]
name = "olo-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-terminal"
path = "src/main.rs"

# Runs the shells, so they outlive Terminal (src/termd.rs).
[[bin]]
name = "olo-termd"
path = "src/termd.rs"

[dependencies]
olo-kit.workspace = true
olo-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
alacritty_terminal = "0.26"
libc = "0.2"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
regex = "1"
