[package]
name = "olo-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-terminal"
path = "src/main.rs"

# Runs the shells, so they outlive Terminal (src/termd.rs).
[[bin]]
name = "olo-termd"
path = "src/termd.rs"

# sudo in Terminal's shells: asks for its password in a window (src/olo_sudo.rs).
[[bin]]
name = "olo-sudo"
path = "src/olo_sudo.rs"

# xdg-open and $BROWSER in Terminal's shells: opens with Olo's default
# apps and returns at once (src/olo_open.rs).
[[bin]]
name = "olo-open"
path = "src/olo_open.rs"

[dependencies]
olo-crash.workspace = true
olo-ui.workspace = true
olo-kit-base.workspace = true
olo-theme.workspace = true
olo-xdg.workspace = true
olo-protocol.workspace = true
olo-system.workspace = true
olo-fido.workspace = true
olo-sync.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit = "0.25"
tracing.workspace = true
alacritty_terminal = "0.26"
libc = "0.2"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
smallvec = "1.6"
regex = "1"
zeroize = "1"
# Repositories and their worktrees, in process (no network: no https or ssh).
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
# GitHub's API, for a branch's pull request.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
