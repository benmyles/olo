[package]
name = "olo-deskbar"
description = "Deskbar: the Olo menu, running applications and status tray"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-deskbar"
path = "src/main.rs"

[dependencies]
# AppImages' own names and icons (`appimages.rs`): their SquashFS read in
# process.
backhand = { version = "0.25", default-features = false, features = ["xz", "gzip", "zstd", "lz4"] }
olo-crash.workspace = true
olo-sync.workspace = true
olo-ui.workspace = true
olo-xdg.workspace = true
olo-protocol.workspace = true
olo-system.workspace = true
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
libc = "0.2"
zeroize = "1"
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
image = { version = "0.25", default-features = false }
