<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Not the site it claims to be</title>
<style>
:root { color-scheme: light dark; --bg: #e8e8e8; --fg: #202020; --dim: #6a6a6a; --rule: #c4c4c4; }
@media (prefers-color-scheme: dark) { :root { --bg: #2b2b2b; --fg: #e4e4e4; --dim: #9a9a9a; --rule: #474747; } }
html, body { min-height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 sans-serif; display: flex; align-items: center; justify-content: center; }
main { max-width: 36em; padding: 2em; }
.haiku { font-size: 21px; font-style: italic; line-height: 1.6; margin: 0 0 1.2em; white-space: pre-line; }
.reason { color: var(--dim); border-top: 1px solid var(--rule); padding-top: 0.8em; font-size: 13px; }
#bytes { word-break: break-all; font: 11px monospace; color: var(--dim); margin-top: 1em; }
button { font: inherit; margin: 1em 0.6em 0 0; padding: 0.2em 1.2em; }
</style>
</head>
<body>
<main>
<p class="haiku">A stranger's face, worn
beneath a friend's borrowed coat.
Do not let him in.</p>
<p class="reason">This site's certificate can't be trusted, so someone may be pretending to be it. ${reason}</p>
<button id="leave" onclick="history.back()">Go Back</button>
<button id="allow">Visit Anyway</button>
<div id="bytes">${bytes}</div>
</main>
<script>
let bytes = document.getElementById('bytes').textContent;
let button = document.getElementById('allow');
if (bytes.length) {
  button.onclick = function() {
    let xhr = new XMLHttpRequest();
    xhr.open('POST', 'chrome:allowcert');
    xhr.onloadend = function() { location.reload(true); };
    xhr.send("${secret}&${bytes}");
  };
} else {
  button.style.display = "none";
}
</script>
</body>
</html>
