<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Can't open this page</title>
<style>
:root { color-scheme: light dark; --bg: #e8e8e8; --fg: #202020; --dim: #6a6a6a; --rule: #c4c4c4; }
@media (prefers-color-scheme: dark) { :root { --bg: #2b2b2b; --fg: #e4e4e4; --dim: #9a9a9a; --rule: #474747; } }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 sans-serif; display: flex; align-items: center; justify-content: center; }
main { max-width: 34em; padding: 2em; }
.haiku { font-size: 21px; font-style: italic; line-height: 1.6; margin: 0 0 1.2em; white-space: pre-line; }
.reason { color: var(--dim); border-top: 1px solid var(--rule); padding-top: 0.8em; font-size: 13px; word-break: break-word; }
button { font: inherit; margin-top: 1em; padding: 0.2em 1.2em; }
</style>
</head>
<body>
<main>
<p class="haiku" id="haiku">The page you called for
is somewhere past the river.
The boat has not come.</p>
<p class="reason">${reason}</p>
<button onclick="location.reload()">Try Again</button>
</main>
<script>
const haiku = [
  "The page you called for\nis somewhere past the river.\nThe boat has not come.",
  "Wires hum, no reply.\nA far server is dreaming\nof the page you want.",
  "Snow on the doorstep;\nno footprints lead to this house.\nTry another road.",
  "You knocked; no one came.\nEven the dust on the porch\nhas gone somewhere else.",
  "A name with no place:\nthe address that you gave\nleads into the mist.",
  "Evening, then silence.\nThe far host keeps its counsel.\nAsk again later."
];
document.getElementById("haiku").textContent = haiku[Math.floor(Math.random() * haiku.length)];
</script>
</body>
</html>
