<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>This page stopped</title>
<style>
:root { color-scheme: light dark; --bg: #e8e8e8; --fg: #202020; --dim: #6a6a6a; --rule: #c4c4c4; }
@media (prefers-color-scheme: dark) { :root { --bg: #2b2b2b; --fg: #e4e4e4; --dim: #9a9a9a; --rule: #474747; } }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 sans-serif; margin: 0; padding: 3em 2em; }
main { max-width: 40em; margin: 0 auto; }
.haiku { font-size: 21px; font-style: italic; line-height: 1.6; margin: 0 0 1.2em; white-space: pre-line; }
pre { color: var(--dim); border-top: 1px solid var(--rule); padding-top: 0.8em; font-size: 11px; white-space: pre-wrap; }
button { font: inherit; padding: 0.2em 1.2em; }
</style>
</head>
<body>
<main>
<p class="haiku">The page fell silent
mid-sentence, like a candle
pinched out by the wind.</p>
<!-- As in Servo's own page, reloading resends a form as GET. -->
<button onclick="location.reload()">Reload</button>
<pre><plaintext>
${details}
