[package]
name = "olo-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Decoding fetched pictures side by side, off the page's thread.
rayon = "1"
olo-crash.workspace = true
olo-ui.workspace = true
olo-theme.workspace = true
olo-xdg.workspace = true
olo-images.workspace = true
olo-preview = { workspace = true, features = ["gpui"] }
# Web pages' Media Source Extensions streams.
olo-mse = { path = "../../crates/mse" }
# System font files are mapped, not read: the OS pages in what is used.
memmap2 = "0.9"
data-url = "0.3.2"
olo-web = { path = "../../crates/web" }
olo-js = { path = "../../crates/js" }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "gzip", "brotli", "deflate", "zstd"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
encoding_rs = "0.8"
mime = "0.3"
percent-encoding = "2"
# Public suffixes, for cookies' domains and sites.
psl = "2"
