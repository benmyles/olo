[package]
name = "tabula-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tabula-browser"
path = "src/main.rs"

[dependencies]
tabula-kit.workspace = true
tabula-keychain.workspace = true
tabula-xdg.workspace = true
zeroize = "1"
base64 = "0.22"
sha2 = "0.11"
data-url = "0.3"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# The engine: Servo, built in (no gstreamer, arboard or webgpu: media and
# the clipboard would go through system libraries, and webgpu would bring
# a second wgpu). Its resources are ours (resources/, engine.rs).
servo = { version = "0.7", default-features = false, features = ["bundled_freetype", "js_jit", "webcrypto", "webgl", "brotli-compression-stream", "multiprocess"] }
# Our media backend (media.rs) in place of gstreamer's; the versions
# match servo's.
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
zvariant = "5"
libc = "0.2"
# Cameras (rtc/capture.rs): Video4Linux and MJPEG, in Rust.
v4l = "0.14"
zune-jpeg = "0.5"
zune-core = "0.5"
getrandom = "0.3"
# Calls (rtc/peer.rs): WebRTC in Rust, H.264 through OpenH264 (built
# from source, in process) and Opus.
webrtc = { version = "0.21", default-features = false, features = ["runtime-tokio", "crypto-aws-lc-rs"] }
rtc = { version = "=0.21.1", default-features = false, features = ["crypto-aws-lc-rs"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
async-trait = "0.1"
bytes = "1"
openh264 = "0.9"
rusty-opus = "1"
opus-decoder = "0.1"
tabula-system.workspace = true
servo-media = "=0.7.0"
# Our patched copy (vendor/), for its process hooks.
servo-constellation = "=0.7.0"
servo-media-dummy = "=0.7.0"
servo-base = "=0.7.0"
tabula-preview.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
raw-window-handle = "0.6"
url = "2.5"
dpi = "0.1"
euclid = "0.22"
keyboard-types = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip", "brotli"] }
