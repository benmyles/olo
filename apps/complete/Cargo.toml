[package]
name = "olo-complete-daemon"
description = "olo-complete: brush's command suggestions from a tiny model of the person's history, served over a socket, fine-tuned every minute, on the processor's SIMD or the GPU"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-complete"
path = "src/main.rs"

[dependencies]
olo-complete.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
blade-graphics = "0.7.0"
blade-macros = "0.3.0"
bytemuck = { version = "1", features = ["derive"] }
