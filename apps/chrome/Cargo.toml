[package]
name = "olo-chrome"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-chrome"
path = "src/main.rs"

[dependencies]
olo-kit.workspace = true
olo-protocol.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
sha2 = "0.11"
flate2 = "1"
liblzma = { version = "0.4", features = ["static"] }
zstd = "0.14"
quick-xml = "0.42"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
olo-theme.workspace = true
olo-keychain.workspace = true
p256 = { version = "0.14", features = ["pkcs8"] }
getrandom = "0.3"
zip = { version = "9", default-features = false }
zeroize = "1"
