<!-- The page tree (extension/tree.js) run on this page by the page itself, in a real Chrome: serve apps/chrome from
     loopback (python3 -m http.server --bind 127.0.0.1 PORT), open /tests/tree-text.html in Olo's Chrome (on an Agent
     Screen: olo-screen run NAME olo-chrome URL), and its title says PASS or what failed. -->
<!doctype html><html><head><meta charset="utf-8"><title>running</title></head><body>
<p id="news"><a href="#a">Nvidia</a> on Monday announced <a href="#b">Huang</a> has been <a href="#c">reinstated</a>, effective immediately, the company said in a statement that went on for quite a while: LONG</p>
<ul><li>An item with <a href="#d">a link</a> and <b>bold</b> words</li></ul>
<p>Press <button>Go</button> to start</p>
<div>Intro text <div>Inner block</div> after</div>
<p>Shown <span style="display:none">hidden</span> words<br>next line</p>
<p>A plain paragraph.</p>
<script>
document.getElementById("news").lastChild.textContent += " and on".repeat(60) + ".";
(async () => {
  try {
    const src = await (await fetch("../extension/tree.js")).text();
    const r = await eval(src);
    const names = (role) => r.nodes.filter((n) => n.role === role).map((n) => n.name);
    const labels = names("Label"), links = names("Link");
    const news = document.getElementById("news").innerText.replace(/\s+/g, " ").trim();
    const want = [
      [labels.includes(news), "the paragraph whole, links' words in place (" + news.length + " letters)"],
      [!labels.some((l) => l.startsWith("on Monday announced has been")), "no paragraph with its links' words left out"],
      [["Nvidia", "Huang", "reinstated", "a link"].every((l) => links.includes(l)), "the links still nodes"],
      [names("ListItem").includes("An item with a link and bold words") && !labels.includes("bold"), "an item is named by its words, its bold ones not said again"],
      [labels.includes("Press to start") && names("Button").includes("Go"), "a button in the line is its own node"],
      [labels.includes("Intro text after") && labels.includes("Inner block"), "a block inside is read by itself"],
      [labels.includes("Shown words next line") && !labels.some((l) => l.includes("hidden")), "what is hidden is left out; a line's break is a space"],
      [labels.includes("A plain paragraph."), "a plain paragraph as before"],
    ];
    const failed = want.filter((w) => !w[0]).map((w) => w[1]);
    document.title = failed.length ? "FAIL " + failed.join(" | ") : "PASS " + want.length + " of " + want.length + ", " + r.nodes.length + " nodes";
  } catch (e) { document.title = "ERROR " + e; }
})();
</script></body></html>
