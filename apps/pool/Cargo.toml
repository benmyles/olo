[package]
name = "olo-pool"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-pool"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
# (The keeper: a subreaper waiting for the copies that serve.)
libc = "0.2"
tracing.workspace = true
olo-ui.workspace = true
olo-xdg.workspace = true
olo-token-pool.workspace = true
# (Which processes hold the gateway's port: `listening`.)
olo-system.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
