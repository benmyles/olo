[package]
name = "olo-tracker"
description = "Tracker: Olo's file manager and desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-tracker"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-sync.workspace = true
olo-ui.workspace = true
olo-kit-base.workspace = true
olo-xdg.workspace = true
olo-appimage.workspace = true
olo-images.workspace = true
olo-protocol.workspace = true
image = { version = "0.25", default-features = false }
tracing.workspace = true
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
# Find is ripgrep: its walker and searcher.
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
olo-preview = { workspace = true, features = ["gpui"] }
