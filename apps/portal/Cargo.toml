[package]
name = "olo-portal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-portal"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-sync.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
memmap2 = "0.9"
libc = "0.2"
png = "0.18"
pipewire = { version = "0.10", features = ["v0_3_34"] }
gbm = { version = "0.18", default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true
olo-kit.workspace = true
olo-images.workspace = true
olo-print = { workspace = true, features = ["kit"] }
olo-protocol.workspace = true
olo-theme.workspace = true
olo-xdg.workspace = true
olo-capture.workspace = true
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
async-channel = "2"
blocking = "1"
serde.workspace = true
serde_json.workspace = true
fast_image_resize = "5"

[dev-dependencies]
# examples/remote_test: a libei sender, as a remote-control program is.
reis = "0.7"
