[package]
name = "olo-passwords"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-passwords"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-protocol.workspace = true
olo-kit.workspace = true
olo-kit-base.workspace = true
olo-theme.workspace = true
olo-system.workspace = true
olo-fido.workspace = true
olo-xdg.workspace = true
olo-keychain.workspace = true
olo-onepassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
getrandom = "0.3"
base64 = "0.22"
p256 = { version = "0.14", features = ["pkcs8"] }
# (Every curve an SSH key is on: a P-384 or P-521 key kept as PKCS#8 or
# SEC1 was read as no key at all, and never offered.)
p384 = { version = "0.14", features = ["pkcs8"] }
p521 = { version = "0.14", features = ["pkcs8"] }
# The SSH agent (`agent`): OpenSSH keys parsed and signed with, natively;
# and a key file under a passphrase opened as it's imported (`sshkey`:
# "encryption", whose crates the build has already, for Rex's keys).
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "rsa", "p256", "p384", "p521", "encryption"] }
# (ssh-key's own: PKCS#8 RSA keys read and written, its signing trait;
# an RSA key made with the system's random source, through `rand_core`.)
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["std", "encoding"] }
rand_core = { version = "0.10", default-features = false }
signature = "3"
libc = "0.2"
sha2 = "0.11"
zeroize = "1"
chacha20poly1305 = "0.11"
rqrr = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
