[package]
name = "olo-passwords"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-passwords"
path = "src/main.rs"

[dependencies]
olo-protocol.workspace = true
olo-ui.workspace = true
olo-kit-base.workspace = true
olo-theme.workspace = true
olo-system.workspace = true
olo-xdg.workspace = true
olo-keychain.workspace = true
olo-onepassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
getrandom = "0.3"
base64 = "0.22"
p256 = { version = "0.14", features = ["pkcs8"] }
sha2 = "0.11"
zeroize = "1"
chacha20poly1305 = "0.11"
