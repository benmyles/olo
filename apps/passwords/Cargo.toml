[package]
name = "tabula-passwords"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tabula-passwords"
path = "src/main.rs"

[dependencies]
tabula-kit.workspace = true
tabula-theme.workspace = true
tabula-system.workspace = true
tabula-xdg.workspace = true
tabula-keychain.workspace = true
tabula-onepassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
base64 = "0.22"
getrandom = "0.3"
p256 = { version = "0.14", features = ["pkcs8"] }
sha2 = "0.11"
zeroize = "1"
chacha20poly1305 = "0.11"
