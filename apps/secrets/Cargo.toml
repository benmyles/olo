[package]
name = "olo-secrets"
description = "Olo's Secret Service (org.freedesktop.secrets): programs' secrets (Chrome's, Slack's) kept by Olo in place of GNOME Keyring, its items copied over first"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-secrets"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-protocol.workspace = true
olo-system.workspace = true
olo-xdg.workspace = true
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
zvariant = { version = "5", features = ["gvariant"] }
# zbus's flags (asking for the bus name with none: waiting in line).
enumflags2 = "0.7"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2"
# The store, sealed at rest (as Passwords' vault).
chacha20poly1305 = "0.11"
zeroize = "1"
getrandom = "0.3"
base64 = "0.22"
# Libsecret's encrypted sessions (dh-ietf1024-sha256-aes128-cbc-pkcs7).
num-bigint = "0.4"
aes = "0.9"
cbc = "0.2"
hkdf = "0.13"
sha2 = "0.11"
