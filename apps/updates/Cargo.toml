[package]
name = "olo-updates"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-updates"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-kit.workspace = true
olo-kit-base.workspace = true
olo-theme.workspace = true
olo-xdg.workspace = true
olo-system.workspace = true
olo-net = { workspace = true, features = ["ureq"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
libc = "0.2"
# A repository's .repo file and Fedora's releases fetched over HTTPS, as
# Weather and Olo Doctor fetch.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
