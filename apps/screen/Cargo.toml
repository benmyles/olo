[package]
name = "olo-screen"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-screen"
path = "src/main.rs"

[dependencies]
olo-ui.workspace = true
olo-theme.workspace = true
olo-protocol.workspace = true
olo-xdg.workspace = true
