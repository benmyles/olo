[package]
name = "olo-voice-service"
description = "Voice processing for every microphone: a processed source in front of the one chosen, echo cancellation against what the speakers play, for calls and recordings"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-voice"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-voice.workspace = true
olo-protocol.workspace = true
olo-system.workspace = true
olo-kit-base.workspace = true
olo-sync.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2"
pipewire = { version = "0.10", features = ["v0_3_49"] }
