[package]
name = "olo-doctor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "olo_doctor"
path = "src/lib.rs"

[[bin]]
name = "olo-doctor"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
# Which sound card is the computer's own: the start-up chime's check.
olo-chime.workspace = true
olo-protocol.workspace = true
olo-sync.workspace = true
olo-net = { workspace = true, features = ["ureq"] }
olo-kit.workspace = true
olo-kit-base.workspace = true
olo-xdg.workspace = true
olo-system.workspace = true
olo-fido.workspace = true
olo-theme.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
memchr = "2"
tracing.workspace = true
# The programs Olo Doctor suggests, from their makers' releases (releases.rs):
# GitHub over HTTPS, the SHA-256 checked, .tar.xz and .tar.gz opened.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
sha2 = "0.11"
liblzma = { version = "0.4", features = ["static"] }
flate2 = "1"
tar = "0.4"
# worktrunk's config, one key set (suggest.rs).
toml_edit = "0.25"
