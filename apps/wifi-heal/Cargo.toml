[package]
name = "olo-wifi-heal"
description = "Watches Wi-Fi and resets a chip whose firmware has stopped joining (a root service Olo Doctor installs)"
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "olo-wifi-heal"
path = "src/main.rs"

[dependencies]
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
zvariant = { version = "5", features = ["gvariant"] }
serde.workspace = true
serde_json.workspace = true
