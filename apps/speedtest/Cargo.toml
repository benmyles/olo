[package]
name = "olo-speedtest"
description = "Network Speed Test: what the connection carries each way, and everything that can be measured or read of it as it does"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-speedtest"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-kit.workspace = true
olo-kit-base.workspace = true
olo-net.workspace = true
olo-system.workspace = true
olo-xdg.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
libc = "0.2"
# The test's own connections, made by hand so each socket is ours to read
# (TCP_INFO): TLS as the system's other programs verify it.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-platform-verifier = "0.7"

[dev-dependencies]
olo-kit = { workspace = true, features = ["lint"] }
