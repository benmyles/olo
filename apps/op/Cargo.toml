[package]
name = "olo-op"
description = "op: 1Password's command-line tool, answered by Olo's Passwords"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-op"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
olo-keychain.workspace = true
olo-xdg.workspace = true
serde_json.workspace = true
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
