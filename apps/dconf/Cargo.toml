[package]
name = "olo-dconf"
description = "Olo's dconf service (ca.desrt.dconf): GSettings programs' settings kept in dconf's own database, written by Olo in place of GNOME's dconf-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "olo-dconf"
path = "src/main.rs"

[dependencies]
olo-crash.workspace = true
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The tests build changes as clients do (GLib's GVariant, by zvariant).
zvariant = { version = "5", features = ["gvariant"] }
