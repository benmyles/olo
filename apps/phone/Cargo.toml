[package]
name = "olo-phone"
description = "Phone: an iPhone's or an Android phone's messages, contacts and one-time codes, spoken to by Olo itself over Bluetooth: the app, the session's service, and the command line"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "olo_phone"
path = "src/lib.rs"

[[bin]]
name = "olo-phone"
path = "src/main.rs"

# The service: a program of its own, with nothing of the window's kit.
[[bin]]
name = "olo-phoned"
path = "src/bin/olo-phoned.rs"

[dependencies]
olo-crash.workspace = true
olo-sync.workspace = true
olo-system.workspace = true
olo-protocol.workspace = true
olo-kit.workspace = true
olo-kit-base.workspace = true
olo-xdg.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zeroize = "1"

[dev-dependencies]
# The layout lint of the window (lint.rs).
olo-kit = { workspace = true, features = ["lint"] }
# The end-to-end test asks the stand-in backend what it was told.
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
