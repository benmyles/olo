[package]
name = "olo-website"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Builds olo-desktop.com, Olo's website, as a static site (website/dist)"

# Not part of Olo's workspace: the website is built on its own
# (`cargo run --release` here), and Olo's build never waits for it.
[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
debug = false
