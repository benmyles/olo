<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Olo Desktop">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="https://olo-desktop.com/brand/olo-social.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/brand/favicon.ico" sizes="48x48">
<link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/fonts/sora.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/noto-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="page-{{page}}">
<a class="skip" href="#main">Skip to the content</a>
<header class="top">
  <div class="wrap top-row">
    <a class="logo" href="/" aria-label="Olo Desktop, home">
      <img class="logo-mark" src="/brand/icon-192.png" width="36" height="36" alt="">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="/brand/olo-name-on-dark.png">
        <img class="logo-name" src="/brand/olo-name.png" width="54" height="24" alt="Olo">
      </picture>
    </a>
    <nav class="nav" aria-label="Site">
      <a href="/#features"{{current:features}}>Features</a>
      <a href="/#apps"{{current:apps}}>Apps</a>
      <a href="/#agents"{{current:agents}}>Agents</a>
      <a href="/brand/"{{current:brand}}>Brand</a>
      <a class="nav-gh" href="https://github.com/benmyles/olo" aria-label="Olo on GitHub">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <a class="button button-small" href="/install/"{{current:install}}>Install</a>
    </nav>
  </div>
</header>
<main id="main">
{{content}}
</main>
<footer class="foot">
  <div class="wrap foot-grid">
    <div class="foot-brand">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="/brand/olo-logo-on-dark.png">
        <img src="/brand/olo-logo.png" width="200" height="94" alt="Olo Desktop">
      </picture>
      <p>A desktop for Linux in the spirit of BeOS. Free and open source, under the MIT License.</p>
    </div>
    <nav class="foot-links" aria-label="More">
      <div>
        <h2>Olo</h2>
        <a href="/#features">Features</a>
        <a href="/#apps">Apps</a>
        <a href="/#agents">Made for agents</a>
        <a href="/#wallpapers">Wallpapers</a>
      </div>
      <div>
        <h2>Get it</h2>
        <a href="/install/">Install</a>
        <a href="https://github.com/benmyles/olo/releases">Releases</a>
        <a href="https://github.com/benmyles/olo">Source code</a>
      </div>
      <div>
        <h2>Learn</h2>
        <a href="https://github.com/benmyles/olo/blob/main/docs/HACKING.md">Hacking on Olo</a>
        <a href="https://github.com/benmyles/olo/blob/main/docs/OLO-BOOK.md">The Olo Book</a>
        <a href="/brand/">Brand</a>
      </div>
    </nav>
  </div>
</footer>
<script src="/js/site.js" defer></script>
</body>
</html>
